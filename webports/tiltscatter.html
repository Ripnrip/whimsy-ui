<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tilt Scatter Restore</title>
<style>
  html, body { margin: 0; background: #1c1a17; }
  body { display: flex; justify-content: center; }
  canvas { display: block; width: 360px; height: 600px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="sheet" width="360" height="600"></canvas>
<script src="tiltscatter-core.js"></script>
<script>
const TS = TiltScatter;
const canvas = document.getElementById("sheet");
const ctx = canvas.getContext("2d");
const specks = TS.grain();

const marks = [
  { t: 0.65, run: (m) => m.toggle(0) },
  { t: 1.95, run: (m) => m.toggle(2) },
  { t: 2.70, run: (m) => m.setTilt(0.84, -0.06) },
  { t: 3.90, run: (m) => m.setTilt(-0.9, 0.5) },
  { t: 5.05, run: (m) => { m.setTilt(0, 0); m.restoreAll(); } },
];

function modelAt(seconds) {
  const m = TS.createModel();
  const h = TS.Tuning.substep;
  const n = Math.max(0, Math.round(seconds / h));
  let mark = 0;
  for (let i = 0; i < n; i++) {
    const now = (i + 1) * h;
    while (mark < marks.length && marks[mark].t <= now + 1e-9) {
      marks[mark].run(m);
      mark += 1;
    }
    m.step(h);
  }
  return m;
}

function rgb(c, a = 1) {
  const r = Math.round(c[0] * 255), g = Math.round(c[1] * 255), b = Math.round(c[2] * 255);
  return a === 1 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${a})`;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw(m) {
  const L = TS.Layout;
  const P = TS.Palette;
  ctx.clearRect(0, 0, L.cardWidth, L.cardHeight);
  ctx.fillStyle = rgb(P.paper);
  ctx.fillRect(0, 0, L.cardWidth, L.cardHeight);
  ctx.fillStyle = rgb(P.ink, 0.045);
  for (const [x, y] of specks) ctx.fillRect(x, y, 1.2, 1.2);

  ctx.fillStyle = rgb(P.tray);
  roundRect(L.rowX, L.trayTop, L.rowWidth, L.trayHeight, 18);
  ctx.fill();
  ctx.strokeStyle = rgb(P.rule, 0.55);
  ctx.setLineDash([3, 4]);
  ctx.beginPath();
  const ruleY = L.boundBottom - 2;
  ctx.moveTo(L.rowX + 16, ruleY);
  ctx.lineTo(L.rowX + L.rowWidth - 16, ruleY);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = rgb(P.ink);
  ctx.font = "600 26px 'Noto Serif', 'Liberation Serif', serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText("Paper tray", L.rowX + 4, 16);
  ctx.font = "500 13px 'DejaVu Sans', sans-serif";
  ctx.fillStyle = rgb(P.ink, 0.62);
  ctx.fillText("Complete a line. Tip the tray.", L.rowX + 4, 48);

  // Level.
  const lx = L.rowX + 4, ly = 70;
  ctx.fillStyle = rgb(P.ink, 0.08);
  roundRect(lx, ly, 72, 16, 8); ctx.fill();
  ctx.strokeStyle = rgb(P.ink, 0.2);
  ctx.stroke();
  ctx.fillStyle = rgb(P.wax);
  ctx.beginPath();
  ctx.arc(lx + 36 + m.tiltX * 28, ly + 8 + m.tiltY * 3, 4, 0, Math.PI * 2);
  ctx.fill();

  for (const row of m.rows) {
    const y = L.rowTop(row.index);
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.06)";
    ctx.shadowBlur = 5;
    ctx.shadowOffsetY = 2;
    ctx.fillStyle = rgb(P.card);
    roundRect(L.rowX, y, L.rowWidth, L.rowHeight, L.rowCorner);
    ctx.fill();
    ctx.restore();
    const cx = L.rowX + 12 + L.checkbox / 2;
    const cy = y + L.rowHeight / 2;
    ctx.strokeStyle = rgb(P.ink, 0.55);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, L.checkbox / 2 - 1, 0, Math.PI * 2);
    ctx.stroke();
    if (row.phase !== "idle") {
      ctx.fillStyle = rgb(P.wax);
      ctx.beginPath();
      ctx.arc(cx, cy, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = rgb(P.card);
      ctx.lineWidth = 1.6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(cx - 4, cy);
      ctx.lineTo(cx - 1, cy + 3);
      ctx.lineTo(cx + 4.5, cy - 3.5);
      ctx.stroke();
    }
  }

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = rgb(P.ink);
  ctx.font = "500 16px 'Noto Serif', serif";
  for (const row of m.rows) {
    if (row.titleOpacity < 0.01) continue;
    ctx.globalAlpha = row.titleOpacity;
    for (const g of TS.glyphs(row.title, row.index)) ctx.fillText(g.glyph, g.homeX, g.homeY + 1);
    ctx.globalAlpha = 1;
  }

  for (const c of m.chips) {
    if (c.opacity < 0.01) continue;
    const speed = Math.sqrt(c.vx * c.vx + c.vy * c.vy);
    const sc = c.scale * TS.flightScale(speed);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.angle);
    ctx.scale(sc, sc);
    ctx.globalAlpha = c.opacity;
    ctx.shadowColor = "rgba(0,0,0,0.16)";
    ctx.shadowBlur = 2;
    ctx.shadowOffsetY = 1;
    ctx.fillStyle = rgb(P.chip);
    roundRect(-c.width / 2, -L.chipHeight / 2, c.width, L.chipHeight, L.chipCorner);
    ctx.fill();
    ctx.shadowColor = "transparent";
    ctx.strokeStyle = rgb(P.ink, 0.28);
    ctx.lineWidth = 0.6;
    ctx.stroke();
    ctx.fillStyle = rgb(P.ink);
    ctx.font = "600 16px 'Noto Serif', serif";
    ctx.fillText(c.glyph, 0, 1);
    ctx.restore();
  }

  const enabled = m.canRestore();
  ctx.globalAlpha = enabled ? 1 : 0.38;
  ctx.fillStyle = rgb(P.ink);
  roundRect(L.rowX, L.buttonTop, 148, L.buttonHeight, 20);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = rgb(P.card);
  ctx.font = "600 15px 'DejaVu Sans', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Restore", L.rowX + 74, L.buttonTop + L.buttonHeight / 2 + 1);

  if (Math.abs(m.tiltX) > 0.08 || Math.abs(m.tiltY) > 0.08) {
    const g = m.gravity();
    const len = Math.max(Math.sqrt(g.x * g.x + g.y * g.y), 1);
    const ox = L.rowX + L.rowWidth - 36;
    const oy = L.trayTop + 28;
    ctx.strokeStyle = rgb(P.ink, 0.45);
    ctx.lineWidth = 1.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox + g.x / len * 16, oy + g.y / len * 16);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

window.renderTime = function (seconds) {
  draw(modelAt(seconds));
  return seconds;
};

// Interactive page: click a row, drag the tray, or press R.
let live = null;
let dragging = false;
function liveModel() {
  if (!live) live = TS.createModel();
  return live;
}
canvas.addEventListener("pointerdown", (e) => {
  const m = liveModel();
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  const L = TS.Layout;
  if (y >= L.buttonTop && y <= L.buttonTop + L.buttonHeight && x >= L.rowX && x <= L.rowX + 148) {
    m.restoreAll();
    return;
  }
  for (const row of m.rows) {
    const top = L.rowTop(row.index);
    if (y >= top && y <= top + L.rowHeight && x >= L.rowX && x <= L.rowX + L.rowWidth) {
      m.toggle(row.index);
      return;
    }
  }
  if (y >= L.trayTop) {
    dragging = true;
    m.setTilt(TS.tiltFromFinger(x - L.rowX, y - L.trayTop, L.rowWidth, L.trayHeight).x,
              TS.tiltFromFinger(x - L.rowX, y - L.trayTop, L.rowWidth, L.trayHeight).y);
  }
});
canvas.addEventListener("pointermove", (e) => {
  if (!dragging || !live) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  const L = TS.Layout;
  const t = TS.tiltFromFinger(x - L.rowX, y - L.trayTop, L.rowWidth, L.trayHeight);
  live.setTilt(t.x, t.y);
});
canvas.addEventListener("pointerup", () => {
  dragging = false;
  if (live) live.setTilt(0, 0);
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (live) {
    live.step(dt);
    draw(live);
  }
  requestAnimationFrame(frame);
}

const params = new URLSearchParams(location.search);
if (params.has("t")) {
  window.renderTime(Number(params.get("t")));
} else if (params.has("play")) {
  // Scripted playback for a human watching the page.
  const start = performance.now();
  const duration = 7.4;
  (function tick(now) {
    const t = Math.min(duration, (now - start) / 1000);
    window.renderTime(t);
    if (t < duration) requestAnimationFrame(tick);
  })(start);
} else {
  draw(liveModel());
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
