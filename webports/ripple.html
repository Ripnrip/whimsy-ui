<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ripple to Hide</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f0e8d6; color: #24302a; font-family: Inter, "Noto Sans", sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    canvas { width: 300px; height: 188px; cursor: pointer; border-radius: 28px; box-shadow: 0 10px 16px rgba(0,0,0,0.22); }
    p { margin: 0; font-size: 15px; }
    label { font-size: 13px; color: #5c675f; }
  </style>
</head>
<body>
  <canvas id="card" width="300" height="188"></canvas>
  <p id="hint">Tap the balance</p>
  <label><input id="reduce" type="checkbox"> Reduce Motion</label>
  <script src="ripple-core.js"></script>
  <script>
    const C = RippleToHideCore;
    const canvas = document.getElementById("card");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const W = canvas.width, H = canvas.height;
    const hint = document.getElementById("hint");
    const reduceBox = document.getElementById("reduce");
    const sources = { shown: null, hidden: null };

    function drawFace(amount) {
      const face = document.createElement("canvas");
      face.width = W; face.height = H;
      const g = face.getContext("2d");
      const grad = g.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, "#14382e");
      grad.addColorStop(1, "#0d211c");
      g.fillStyle = grad;
      g.beginPath();
      g.roundRect(0, 0, W, H, 28);
      g.fill();
      g.fillStyle = "rgba(245,237,219,0.07)";
      g.beginPath();
      g.arc(250, 20, 90, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = "rgba(245,237,219,0.62)";
      g.font = "600 12px Inter, sans-serif";
      g.fillText("EVERYDAY", 22, 32);
      g.font = "500 12px Inter, sans-serif";
      const account = "···· 4291";
      g.fillText(account, W - 22 - g.measureText(account).width, 32);
      g.fillStyle = "#c9a357";
      g.beginPath();
      g.roundRect(22, 58, 36, 28, 5);
      g.fill();
      g.strokeStyle = "rgba(13,33,28,0.35)";
      g.strokeRect(27, 63, 26, 18);
      g.fillStyle = "rgba(245,237,219,0.55)";
      g.font = "500 13px Inter, sans-serif";
      g.fillText("Available", 22, 122);
      g.fillStyle = "#f5eddb";
      g.font = "600 34px Inter, sans-serif";
      g.fillText(amount, 22, 162);
      return face;
    }

    sources.shown = drawFace("$4,820.16");
    sources.hidden = drawFace(C.mask("$4,820.16"));
    const amountBox = sources.shown.getContext("2d").measureText("$4,820.16");
    const tap = { x: 22 + amountBox.width / 2, y: 148 };

    const blend = document.createElement("canvas");
    blend.width = W; blend.height = H;
    const bctx = blend.getContext("2d", { willReadFrequently: true });

    function paint(time, amplitude, maskAmount) {
      bctx.clearRect(0, 0, W, H);
      bctx.globalAlpha = 1 - maskAmount;
      bctx.drawImage(sources.shown, 0, 0);
      bctx.globalAlpha = maskAmount;
      bctx.drawImage(sources.hidden, 0, 0);
      bctx.globalAlpha = 1;
      const src = bctx.getImageData(0, 0, W, H).data;
      const out = ctx.createImageData(W, H);
      const dst = out.data;
      const warp = amplitude !== 0 && time > 0;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          let sx = x, sy = y;
          if (warp) {
            const p = C.samplePosition({ x, y }, tap, time, amplitude);
            sx = p.x; sy = p.y;
          }
          if (sx < 0) sx = 0; if (sy < 0) sy = 0;
          if (sx > W - 1) sx = W - 1; if (sy > H - 1) sy = H - 1;
          const x0 = Math.floor(sx), y0 = Math.floor(sy);
          const x1 = Math.min(x0 + 1, W - 1), y1 = Math.min(y0 + 1, H - 1);
          const wx = sx - x0, wy = sy - y0;
          const i = (y * W + x) * 4;
          for (let c = 0; c < 4; c++) {
            const i00 = (y0 * W + x0) * 4 + c;
            const i10 = (y0 * W + x1) * 4 + c;
            const i01 = (y1 * W + x0) * 4 + c;
            const i11 = (y1 * W + x1) * 4 + c;
            const top = src[i00] * (1 - wx) + src[i10] * wx;
            const bot = src[i01] * (1 - wx) + src[i11] * wx;
            dst[i + c] = top * (1 - wy) + bot * wy;
          }
        }
      }
      ctx.putImageData(out, 0, 0);
    }

    const bounds = { minX: 0, minY: 0, maxX: W, maxY: H };
    let model = C.createModel({});
    let last = performance.now();

    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (model.phase === "hiding" || model.phase === "revealing") C.advance(model, dt);
      paint(C.shaderTime(model), C.shaderAmplitude(model), C.maskAmount(model));
      hint.textContent = model.showsMask ? "Tap again to show it" : "Tap the balance";
      requestAnimationFrame(tick);
    }

    canvas.addEventListener("click", (event) => {
      if (model.phase !== "shown" && model.phase !== "hidden") return;
      const rect = canvas.getBoundingClientRect();
      const point = {
        x: (event.clientX - rect.left) * (W / rect.width),
        y: (event.clientY - rect.top) * (H / rect.height),
      };
      model.reduceMotion = reduceBox.checked;
      const radius = C.passRadius(point, bounds, C.RULES.speed * C.RULES.duration);
      C.toggle(model, point, radius);
    });

    requestAnimationFrame(tick);
  </script>
</body>
</html>
