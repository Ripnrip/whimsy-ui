<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card to Pill</title>
<style>
  html, body { margin: 0; height: 100%; background: #070914; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #sheet { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="780" height="1688" style="width:390px;height:844px"></canvas>
<canvas id="sheet" width="10" height="10"></canvas>
<script type="module">
import {
  TUNING, PAY_AT, frame, light, cardContentOpacity, dotOpacity, glowOpacity, edgeGlow,
  displayFlip, clamp01, createModel, payAt, step, demoAt, demoDuration,
} from "./glassmorph-core.mjs";

const W = TUNING.canvasWidth;
const H = TUNING.canvasHeight;
const stage = document.querySelector("#stage");
const sheet = document.querySelector("#sheet");
const ctx = stage.getContext("2d");
const sheetCtx = sheet.getContext("2d");
const FONT = '"Inter", "DejaVu Sans", sans-serif';

function rgb(c) { return `rgb(${c.r}, ${c.g}, ${c.b})`; }
function rgba(c, a) { return `rgba(${c.r}, ${c.g}, ${c.b}, ${a})`; }

function roundRect(c, x, y, w, h, r) {
  const radius = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  c.beginPath();
  c.moveTo(x + radius, y);
  c.arcTo(x + w, y, x + w, y + h, radius);
  c.arcTo(x + w, y + h, x, y + h, radius);
  c.arcTo(x, y + h, x, y, radius);
  c.arcTo(x, y, x + w, y, radius);
  c.closePath();
}

function rot(p, angle) {
  const c = Math.cos(angle);
  const s = Math.sin(angle);
  return { x: p.x * c - p.y * s, y: p.x * s + p.y * c };
}

function drawTracked(c, text, x, y, tracking) {
  const chars = text.toUpperCase().split("");
  c.save();
  c.textAlign = "left";
  c.textBaseline = "middle";
  const widths = chars.map((ch) => c.measureText(ch).width);
  const total = widths.reduce((sum, w) => sum + w, 0) + tracking * Math.max(0, chars.length - 1);
  let cursor = x - total / 2;
  chars.forEach((ch, i) => {
    c.fillText(ch, cursor, y);
    cursor += widths[i] + tracking;
  });
  c.restore();
}

function drawBackground(c) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(TUNING.backgroundTop));
  g.addColorStop(1, rgb(TUNING.backgroundBottom));
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
  const vignette = c.createRadialGradient(W / 2, H * 0.46, 80, W / 2, H * 0.5, 560);
  vignette.addColorStop(0, "rgba(0,0,0,0)");
  vignette.addColorStop(1, "rgba(0,0,0,0.38)");
  c.fillStyle = vignette;
  c.fillRect(0, 0, W, H);
}

function drawGlow(c, orb, color, opacity) {
  if (opacity <= 0.012 || c.globalAlpha <= 0.012) return;
  c.save();
  c.filter = `blur(${Math.max(0, orb.blur)}px)`;
  c.globalAlpha *= opacity;
  const g = c.createRadialGradient(orb.center.x, orb.center.y, 0, orb.center.x, orb.center.y, orb.radius);
  g.addColorStop(0, "rgba(255,255,255,0.92)");
  g.addColorStop(0.22, rgb(color));
  g.addColorStop(0.72, rgba(color, 0.55));
  g.addColorStop(1, rgba(color, 0));
  c.fillStyle = g;
  c.beginPath();
  c.arc(orb.center.x, orb.center.y, orb.radius, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

function drawFace(c) {
  c.fillStyle = "rgba(255,255,255,0.82)";
  c.font = `600 ${TUNING.brandSize}px ${FONT}`;
  drawTracked(c, TUNING.defaultLabel, 0, TUNING.brandLocalY, 2.4);
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.fillStyle = "#ffffff";
  c.font = `400 ${TUNING.amountSize}px "Cantarell", "DejaVu Sans", sans-serif`;
  c.fillText(TUNING.defaultAmount, 0, TUNING.amountLocalY);
  c.fillStyle = "rgba(255,255,255,0.62)";
  c.font = `400 ${TUNING.captionSize}px ${FONT}`;
  c.fillText(TUNING.caption, 0, TUNING.captionLocalY);
  roundRect(
    c,
    -TUNING.payButtonWidth / 2,
    TUNING.payButtonLocal.y - TUNING.payButtonHeight / 2,
    TUNING.payButtonWidth,
    TUNING.payButtonHeight,
    TUNING.payButtonHeight / 2,
  );
  c.fillStyle = "rgba(255,255,255,0.94)";
  c.fill();
  c.fillStyle = rgb(TUNING.ink);
  c.font = `600 ${TUNING.paySize}px ${FONT}`;
  c.fillText(TUNING.payTitle, 0, TUNING.payButtonLocal.y);
}

function drawDot(c, orb, color, posed, opacity) {
  if (opacity <= 0.012 || c.globalAlpha <= 0.012) return;
  const offset = rot(
    { x: orb.center.x - posed.center.x, y: orb.center.y - posed.center.y },
    -posed.tilt,
  );
  c.save();
  c.globalAlpha *= opacity;
  c.fillStyle = rgb(color);
  c.beginPath();
  c.arc(offset.x, offset.y, orb.radius, 0, Math.PI * 2);
  c.fill();
  c.globalAlpha *= 0.7;
  c.fillStyle = "#ffffff";
  c.beginPath();
  c.arc(offset.x - orb.radius * 0.22, offset.y - orb.radius * 0.28, orb.radius * 0.32, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

function drawPose(c, progress, textOpacity, markOpacity, glow, edge, flip) {
  const posed = frame(progress);
  const amber = light("amber", progress);
  const red = light("red", progress);
  drawGlow(c, amber, TUNING.amber, glow);
  drawGlow(c, red, TUNING.red, glow);

  c.save();
  c.translate(posed.center.x, posed.center.y);
  c.rotate(posed.tilt);
  c.scale(Math.max(0.012, Math.cos(flip)), 1);
  const x = -posed.width / 2;
  const y = -posed.height / 2;
  c.save();
  c.shadowColor = "rgba(0,0,0,0.38)";
  c.shadowBlur = 28;
  c.shadowOffsetY = 16;
  roundRect(c, x, y, posed.width, posed.height, posed.cornerRadius);
  c.fillStyle = "rgba(255,255,255,0.14)";
  c.fill();
  c.restore();

  c.save();
  roundRect(c, x, y, posed.width, posed.height, posed.cornerRadius);
  c.clip();
  c.fillStyle = "rgba(255,255,255,0.14)";
  c.fillRect(x, y, posed.width, posed.height);
  const sheen = c.createLinearGradient(0, y, 0, y + posed.height * 0.46);
  sheen.addColorStop(0, "rgba(255,255,255,0.42)");
  sheen.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = sheen;
  c.fillRect(x, y, posed.width, posed.height * 0.46);
  c.restore();
  roundRect(c, x, y, posed.width, posed.height, posed.cornerRadius);
  c.strokeStyle = "rgba(255,255,255,0.5)";
  c.lineWidth = 1.25;
  c.stroke();

  if (textOpacity > 0.01 && c.globalAlpha > 0.012) {
    c.save();
    c.globalAlpha *= textOpacity;
    c.scale(posed.width / TUNING.cardWidth, posed.height / TUNING.cardHeight);
    drawFace(c);
    c.restore();
  }
  drawDot(c, amber, TUNING.amber, posed, markOpacity);
  drawDot(c, red, TUNING.red, posed, markOpacity);
  c.restore();

  if (edge > 0.02) {
    c.save();
    c.translate(posed.center.x, posed.center.y);
    c.rotate(posed.tilt);
    c.globalAlpha *= edge;
    const h = Math.max(12, posed.height * 0.72);
    roundRect(c, -1.5, -h / 2, 3, h, 1.5);
    c.fillStyle = "rgba(255,255,255,0.92)";
    c.fill();
    c.restore();
  }
}

function drawModel(c, model) {
  drawBackground(c);
  if (model.reduceMotion) {
    c.save();
    c.globalAlpha = 1 - clamp01(model.progress);
    drawPose(c, 0, 1, 0, 1, 0, 0);
    c.restore();
    c.save();
    c.globalAlpha = clamp01(model.progress);
    drawPose(c, 1, 0, 1, 0, 0, 0);
    c.restore();
    return;
  }
  drawPose(
    c,
    model.progress,
    cardContentOpacity(model.phase, model.progress, model.flipAngle, false),
    dotOpacity(model.phase, model.progress, model.flipAngle, false),
    glowOpacity(model.phase, model.progress, model.flipAngle, false),
    edgeGlow(model.phase, model.flipAngle, false),
    displayFlip(model.flipAngle, false),
  );
}

function paintStage(model) {
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawModel(ctx, model);
}

const params = new URLSearchParams(location.search);
const driven = params.get("drive") === "1";

if (!driven) {
  let live = createModel(false);
  let last = 0;
  stage.addEventListener("pointerdown", (event) => {
    const rect = stage.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * W;
    const y = ((event.clientY - rect.top) / rect.height) * H;
    payAt(live, { x, y });
  });
  const tick = (now) => {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    if (dt > 0) step(live, dt);
    paintStage(live);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function stills() {
  const duration = demoDuration(false);
  let spring = null;
  let overshoot = null;
  let overshootProgress = -1;
  let pill = null;
  let edge = null;
  let edgeDistance = 1;
  let open = null;
  for (let t = 0; t <= duration + 1e-9; t += 1 / 30) {
    const model = demoAt(t);
    if (spring === null && model.phase === "morphing" && model.progress > 0.28) spring = t;
    if (model.phase === "morphing" && model.progress > overshootProgress) {
      overshootProgress = model.progress;
      overshoot = t;
    }
    if (pill === null && model.phase === "pill") pill = t;
    if (model.phase === "unfolding") {
      const distance = Math.abs(model.flipAngle - Math.PI / 2);
      if (distance < edgeDistance) {
        edgeDistance = distance;
        edge = t;
      }
    }
    if (open === null && model.phase === "card" && model.clock > 0.2 && t > PAY_AT) open = t;
  }
  let crossfade = null;
  let reduced = null;
  const reducedDuration = demoDuration(true);
  for (let t = 0; t <= reducedDuration + 1e-9; t += 1 / 30) {
    const model = demoAt(t, { reduceMotion: true });
    if (crossfade === null && model.phase === "morphing" && model.progress >= 0.45) crossfade = t;
    if (reduced === null && model.phase === "pill") reduced = t;
  }
  return [
    { name: "Card", t: 0.2 },
    { name: "Spring", t: spring ?? 0.6 },
    { name: "Overshoot", t: overshoot ?? 0.8 },
    { name: "Pill", t: pill ?? 1.3 },
    { name: "Half-turn", t: edge ?? 2.4 },
    { name: "Open", t: open ?? duration },
    { name: "Crossfade", t: crossfade ?? 0.6, reduceMotion: true },
    { name: "Reduced", t: reduced ?? 1.0, reduceMotion: true },
  ];
}

window.renderAt = (t) => {
  const model = demoAt(t);
  paintStage(model);
  return { phase: model.phase, progress: model.progress, flip: model.flipAngle };
};

window.renderSheet = () => {
  const panels = stills();
  const srcW = W;
  const srcH = H;
  const panelW = 180;
  const panelH = Math.round(srcH * (panelW / srcW));
  const cols = 4;
  const labelH = 28;
  const gap = 16;
  const rows = 2;
  const width = gap + cols * (panelW + gap);
  const height = gap + rows * (labelH + panelH + gap);
  sheet.width = width * 2;
  sheet.height = height * 2;
  sheet.style.width = `${width}px`;
  sheet.style.height = `${height}px`;
  sheetCtx.setTransform(2, 0, 0, 2, 0, 0);
  sheetCtx.fillStyle = "#070914";
  sheetCtx.fillRect(0, 0, width, height);
  panels.forEach((still, index) => {
    const col = index % cols;
    const row = Math.floor(index / cols);
    const x = gap + col * (panelW + gap);
    const y = gap + row * (labelH + panelH + gap);
    sheetCtx.fillStyle = "#f4efe4";
    sheetCtx.font = `600 13px ${FONT}`;
    sheetCtx.textAlign = "left";
    sheetCtx.textBaseline = "middle";
    sheetCtx.fillText(still.name, x, y + 12);
    const model = demoAt(still.t, { reduceMotion: !!still.reduceMotion });
    const snapshot = document.createElement("canvas");
    snapshot.width = srcW * 2;
    snapshot.height = srcH * 2;
    const snap = snapshot.getContext("2d");
    snap.setTransform(2, 0, 0, 2, 0, 0);
    drawModel(snap, model);
    sheetCtx.drawImage(snapshot, x, y + labelH, panelW, panelH);
  });
  sheet.style.display = "block";
  stage.style.display = "none";
  document.body.style.background = "#070914";
  return { width, height };
};

window.__ready = true;
window.__demoDuration = demoDuration(false);
</script>
</body>
</html>
